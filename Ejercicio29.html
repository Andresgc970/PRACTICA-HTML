<!DOCTYPE html>

  <title>Prueba de formulario</title>
  <meta charset="UTF-8">

<body>
    <p>Problema:Confeccionar un formulario que permita ingresar el nombre de una persona, su mail, su dni (documento nacional de identidad) y finalmente su curriculum (este último dato hacerlo utilizando un textarea)</p> <br>
<form action="registrardatos.php" method="post">
  Ingrese su nombre:
  <input type="text" name="nombre" size="30"><br>
  Ingrese su mail:
  <input type="text" name="mail" size="50"><br>
  Ingrese su dni:
  <input type="text" name="dni" size="9"><br>
  Ingrese su Curriculum:<br>
  <textarea name="curriculum" rows="7" cols="80"></textarea> 
  <br>
  <input type="submit" value="Enviar">
</form>
</body>
</html>
