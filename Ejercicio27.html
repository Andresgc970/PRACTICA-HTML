<!DOCTYPE html>
<html>
<head>
  <title>Prueba de formulario</title>
  <meta charset="UTF-8">
</head>
<body>
    <p>Problema:Confeccionar un formulario que solicite el ingreso del nombre de una persona y su edad. Luego llamar a la página "registrardatos.php" para que imprima en pantalla los valores ingresados. Disponer un botón de tipo submit para el envío de los datos.</p> <br>
<form action="registrardatos.php" method="post">
  Ingrese nombre:
  <input type="text" name="nombre" size="20">
  <br>
  Ingrese su edad:
  <input type="text" name="edad" size="3">
  <br>
  <input type="submit" value="enviar">
</form>
</body>
</html>
